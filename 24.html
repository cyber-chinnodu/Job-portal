<html>
    <head>
     <title>IPv4 Address Validator</title>
     <style>
       body {
         font-family: Arial;
         margin: 40px;
       }
       input, button {
         padding: 8px;
         margin: 5px;
       }
       #result {
         font-weight: bold;
         margin-top: 10px;
       }
     </style>
    </head>
    <body>
     <h2>IPv4 Address Validator</h2>
     <label for="ip">Enter IP Address:</label>
     <input type="text" id="ip" placeholder="e.g., 192.168.0.1">
     <button onclick="validateIP()">Validate</button>
     <div id="result"></div>
     <script>
       function validateIP() {
         const ip = document.getElementById("ip").value;
         const ipv4Regex = /^(25[0-5]|2[0-4]\d|1\d{2}|[1-9]?\d)(\.(25[0-5]|2[0-4]\d|1\d{2}|[1-9]?\d)){3}$/;
         const resultDiv = document.getElementById("result");
         if (ipv4Regex.test(ip)) {
           resultDiv.textContent = `"${ip}" is a valid IPv4 address.`;
           resultDiv.style.color = "green";
         } else {
           resultDiv.textContent = `"${ip}" is NOT a valid IPv4 address.`;
         }
           resultDiv.style.color = "red";
       }
     </script>
    </body>
    </html>
